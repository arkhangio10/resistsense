services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      RESISTSENSE_CORS_ORIGINS: ${RESISTSENSE_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
